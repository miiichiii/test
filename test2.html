<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Quiz App</title>
    <!-- React と ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    <!-- Framer Motion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/10.16.4/framer-motion.js"></script>
    <!-- Lucide Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Destructure required components
        const { motion, AnimatePresence } = window.framerMotion;
        const { Check, X, RotateCcw } = window.lucide;

        function QuizApp() {
            // State
            const [currentQuestion, setCurrentQuestion] = React.useState(0);
            const [selectedAnswer, setSelectedAnswer] = React.useState(null);
            const [score, setScore] = React.useState(0);
            const [isCompleted, setIsCompleted] = React.useState(false);
            const [answers, setAnswers] = React.useState([]);

            // Questions data
            const questions = [
                {
                    question: "中枢神経系の支持細胞として正しいのはどれか。",
                    options: [
                        "シュワン細胞",
                        "オリゴデンドロサイト",
                        "外套細胞",
                        "線維芽細胞"
                    ],
                    answer: 1,
                    explanation: "オリゴデンドロサイトは中枢神経系の支持細胞で、軸索に髄鞘を形成します。シュワン細胞は末梢神経系の支持細胞です。"
                },
                {
                    question: "神経伝達物質として興奮性に働くものはどれか。",
                    options: [
                        "GABA",
                        "グリシン",
                        "グルタミン酸",
                        "セロトニン"
                    ],
                    answer: 2,
                    explanation: "グルタミン酸は興奮性の神経伝達物質で、中枢神経系で重要な役割を果たしています。GABAやグリシンは抑制性の神経伝達物質です。"
                }
            ];

            // Handle answer selection
            const handleAnswer = (index) => {
                if (selectedAnswer !== null) return;
                setSelectedAnswer(index);
                const isCorrect = index === questions[currentQuestion].answer;
                if (isCorrect) {
                    setScore(prev => prev + 1);
                }
                setAnswers(prev => [...prev, {
                    questionIndex: currentQuestion,
                    selectedAnswer: index,
                    isCorrect
                }]);
            };

            // Handle next question
            const handleNext = () => {
                if (selectedAnswer === null) return;
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(prev => prev + 1);
                    setSelectedAnswer(null);
                } else {
                    setIsCompleted(true);
                }
            };

            // Handle retry
            const handleRetry = () => {
                setCurrentQuestion(0);
                setSelectedAnswer(null);
                setScore(0);
                setIsCompleted(false);
                setAnswers([]);
            };

            // Results view
            if (isCompleted) {
                return (
                    <div className="min-h-screen w-full bg-white flex flex-col items-center p-4">
                        <div className="w-full max-w-2xl">
                            <motion.div 
                                initial={{ opacity: 0, y: -20 }}
                                animate={{ opacity: 1, y: 0 }}
                                className="text-center mb-8"
                            >
                                <h1 className="text-3xl font-light mb-4">
                                    Quiz Complete!
                                </h1>
                                <div className="text-5xl font-light">
                                    {Math.round((score / questions.length) * 100)}%
                                    <span className="text-gray-500 text-xl ml-2">
                                        ({score}/{questions.length} correct)
                                    </span>
                                </div>
                            </motion.div>

                            <div className="space-y-6">
                                {questions.map((question, index) => (
                                    <motion.div
                                        key={index}
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: index * 0.1 }}
                                        className="border rounded-lg overflow-hidden"
                                    >
                                        <div className="p-4 bg-gray-50 border-b">
                                            <div className="flex justify-between items-center">
                                                <h2 className="text-lg font-medium">
                                                    Question {index + 1}
                                                </h2>
                                                {answers[index]?.isCorrect ? (
                                                    <span className="text-green-500 flex items-center">
                                                        <Check className="w-4 h-4 mr-1" />
                                                        Correct
                                                    </span>
                                                ) : (
                                                    <span className="text-red-500 flex items-center">
                                                        <X className="w-4 h-4 mr-1" />
                                                        Incorrect
                                                    </span>
                                                )}
                                            </div>
                                            <p className="mt-2">{question.question}</p>
                                        </div>
                                        <div className="p-4">
                                            <div className="space-y-2">
                                                {question.options.map((option, optionIndex) => (
                                                    <div
                                                        key={optionIndex}
                                                        className={`p-3 rounded border ${
                                                            optionIndex === question.answer
                                                                ? 'border-green-500 bg-green-50'
                                                                : optionIndex === answers[index]?.selectedAnswer
                                                                    ? 'border-red-500 bg-red-50'
                                                                    : 'border-gray-200'
                                                        }`}
                                                    >
                                                        {option}
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="mt-4 p-3 bg-gray-50 rounded text-sm">
                                                {question.explanation}
                                            </div>
                                        </div>
                                    </motion.div>
                                ))}
                            </div>

                            <motion.button
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                transition={{ delay: 0.5 }}
                                onClick={handleRetry}
                                className="w-full mt-8 p-4 bg-black text-white flex items-center justify-center gap-2 hover:bg-gray-800"
                            >
                                <RotateCcw className="w-4 h-4" />
                                RETRY QUIZ
                            </motion.button>
                        </div>
                    </div>
                );
            }

            // Quiz view
            return (
                <div className="min-h-screen w-full bg-white flex flex-col items-center justify-center p-4">
                    <div className="w-full max-w-2xl">
                        <div className="relative w-full h-1 bg-gray-100 mb-8">
                            <motion.div
                                initial={{ width: 0 }}
                                animate={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}
                                className="absolute top-0 left-0 h-full bg-black"
                            />
                        </div>

                        <motion.div
                            key={currentQuestion}
                            initial={{ opacity: 0, x: 20 }}
                            animate={{ opacity: 1, x: 0 }}
                            className="space-y-8"
                        >
                            <div className="flex justify-between items-center">
                                <h1 className="text-2xl font-light">
                                    Question {currentQuestion + 1}
                                </h1>
                                <p className="text-gray-500">
                                    {currentQuestion + 1} / {questions.length}
                                </p>
                            </div>

                            <div className="space-y-6">
                                <p className="text-lg">
                                    {questions[currentQuestion].question}
                                </p>

                                <div className="space-y-3">
                                    {questions[currentQuestion].options.map((option, index) => (
                                        <motion.button
                                            key={index}
                                            initial={{ opacity: 0, y: 20 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            transition={{ delay: index * 0.1 }}
                                            onClick={() => handleAnswer(index)}
                                            disabled={selectedAnswer !== null}
                                            className={`w-full p-4 text-left border rounded-lg ${
                                                selectedAnswer === null 
                                                    ? 'hover:border-black' 
                                                    : index === questions[currentQuestion].answer
                                                        ? 'border-green-500 bg-green-50'
                                                        : selectedAnswer === index
                                                            ? 'border-red-500 bg-red-50'
                                                            : ''
                                            }`}
                                        >
                                            {option}
                                        </motion.button>
                                    ))}
                                </div>

                                {selectedAnswer !== null && (
                                    <motion.div
                                        initial={{ opacity: 0, height: 0 }}
                                        animate={{ opacity: 1, height: "auto" }}
                                        className="overflow-hidden"
                                    >
                                        <div className="p-4 bg-gray-50 rounded-lg">
                                            <p className="text-sm">
                                                {questions[currentQuestion].explanation}
                                            </p>
                                        </div>
                                    </motion.div>
                                )}
                            </div>

                            {selectedAnswer !== null && (
                                <motion.button
                                    initial={{ opacity: 0 }}
                                    animate={{ opacity: 1 }}
                                    onClick={handleNext}
                                    className="w-full p-4 bg-black text-white hover:bg-gray-800"
                                >
                                    {currentQuestion === questions.length - 1 ? 'SHOW RESULTS' : 'NEXT QUESTION'}
                                </motion.button>
                            )}
                        </motion.div>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuizApp />);
    </script>
</body>
</html>
