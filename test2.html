<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .question-card {
            margin-bottom: 30px;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .question-number {
            font-size: 24px;
            font-weight: 300;
            color: #666;
        }
        .progress-count {
            font-size: 14px;
            color: #666;
        }
        .question-text {
            font-size: 20px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-button {
            padding: 16px 20px;
            border: 2px solid #eee;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .option-button:hover:not(:disabled) {
            border-color: #333;
            transform: translateY(-1px);
        }
        .option-button:disabled {
            cursor: default;
        }
        .correct {
            background: #f0fff4;
            border-color: #48bb78;
        }
        .incorrect {
            background: #fff5f5;
            border-color: #f56565;
        }
        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 12px;
            font-size: 15px;
            color: #4a5568;
            animation: slideDown 0.3s ease;
        }
        .next-button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: #000;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .next-button:hover {
            background: #333;
            transform: translateY(-1px);
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: #000;
            transition: width 0.3s ease;
        }
        .results {
            text-align: center;
            padding: 20px 0;
        }
        .score {
            font-size: 48px;
            font-weight: 300;
            margin: 20px 0;
        }
        .score-details {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        .retry-button {
            background: #000;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .retry-button:hover {
            background: #333;
            transform: translateY(-1px);
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .answer-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function QuizApp() {
            const [currentQuestion, setCurrentQuestion] = React.useState(0);
            const [selectedAnswer, setSelectedAnswer] = React.useState(null);
            const [score, setScore] = React.useState(0);
            const [showExplanation, setShowExplanation] = React.useState(false);
            const [isCompleted, setIsCompleted] = React.useState(false);
            const [answers, setAnswers] = React.useState([]);

            const questions = [
                {
                    question: "中枢神経系の支持細胞として正しいのはどれか。",
                    options: [
                        "シュワン細胞",
                        "オリゴデンドロサイト",
                        "外套細胞",
                        "線維芽細胞"
                    ],
                    answer: 1,
                    explanation: "オリゴデンドロサイトは中枢神経系の支持細胞で、軸索に髄鞘を形成します。シュワン細胞は末梢神経系の支持細胞です。"
                },
                {
                    question: "神経伝達物質として興奮性に働くものはどれか。",
                    options: [
                        "GABA",
                        "グリシン",
                        "グルタミン酸",
                        "セロトニン"
                    ],
                    answer: 2,
                    explanation: "グルタミン酸は興奮性の神経伝達物質で、中枢神経系で重要な役割を果たしています。GABAやグリシンは抑制性の神経伝達物質です。"
                }
            ];

            const handleAnswer = (index) => {
                if (selectedAnswer !== null) return;
                setSelectedAnswer(index);
                setShowExplanation(true);
                const isCorrect = index === questions[currentQuestion].answer;
                if (isCorrect) {
                    setScore(score + 1);
                }
                setAnswers([...answers, { questionIndex: currentQuestion, selected: index, isCorrect }]);
            };

            const handleNext = () => {
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                    setSelectedAnswer(null);
                    setShowExplanation(false);
                } else {
                    setIsCompleted(true);
                }
            };

            const handleRetry = () => {
                setCurrentQuestion(0);
                setSelectedAnswer(null);
                setScore(0);
                setShowExplanation(false);
                setIsCompleted(false);
                setAnswers([]);
            };

            const getButtonClass = (index) => {
                if (selectedAnswer === null) return "option-button";
                if (index === questions[currentQuestion].answer) return "option-button correct";
                if (index === selectedAnswer) return "option-button incorrect";
                return "option-button";
            };

            if (isCompleted) {
                return (
                    <div className="container results">
                        <h1>クイズ完了！</h1>
                        <div className="score">{Math.round((score / questions.length) * 100)}%</div>
                        <div className="score-details">
                            {score} / {questions.length} 問正解
                        </div>
                        
                        {questions.map((question, qIndex) => {
                            const answer = answers[qIndex];
                            return (
                                <div key={qIndex} className="question-card">
                                    <div className="question-text">
                                        {qIndex + 1}. {question.question}
                                    </div>
                                    <div className="options">
                                        {question.options.map((option, oIndex) => (
                                            <div
                                                key={oIndex}
                                                className={`option-button ${
                                                    oIndex === question.answer 
                                                        ? 'correct'
                                                        : answer.selected === oIndex && 'incorrect'
                                                }`}
                                            >
                                                {option}
                                            </div>
                                        ))}
                                    </div>
                                    <div className="explanation">
                                        {question.explanation}
                                    </div>
                                </div>
                            );
                        })}
                        
                        <button className="retry-button" onClick={handleRetry}>
                            もう一度挑戦する
                        </button>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="progress-bar">
                        <div 
                            className="progress" 
                            style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}
                        />
                    </div>
                    
                    <div className="question-card">
                        <div className="question-header">
                            <div className="question-number">Question {currentQuestion + 1}</div>
                            <div className="progress-count">{currentQuestion + 1} / {questions.length}</div>
                        </div>
                        
                        <div className="question-text">
                            {questions[currentQuestion].question}
                        </div>
                        
                        <div className="options">
                            {questions[currentQuestion].options.map((option, index) => (
                                <button
                                    key={index}
                                    className={getButtonClass(index)}
                                    onClick={() => handleAnswer(index)}
                                    disabled={selectedAnswer !== null}
                                >
                                    {option}
                                    {selectedAnswer !== null && index === questions[currentQuestion].answer && (
                                        <span className="answer-icon">✓</span>
                                    )}
                                    {selectedAnswer === index && index !== questions[currentQuestion].answer && (
                                        <span className="answer-icon">×</span>
                                    )}
                                </button>
                            ))}
                        </div>

                        {showExplanation && (
                            <div className="explanation">
                                {questions[currentQuestion].explanation}
                            </div>
                        )}

                        {selectedAnswer !== null && (
                            <button className="next-button" onClick={handleNext}>
                                {currentQuestion === questions.length - 1 ? '結果を見る' : '次の問題へ'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuizApp />);
    </script>
</body>
</html>
